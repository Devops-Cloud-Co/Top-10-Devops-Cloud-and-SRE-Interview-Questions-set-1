
services:
  app:
    build: .
    container_name: myapp
    image: devops-demo-app:v1

    ports:
      - "8181:8080"

    environment:
      APP_VERSION: v1.0
      ENVIRONMENT: development

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 15s
      timeout: 5s
      retries: 3
